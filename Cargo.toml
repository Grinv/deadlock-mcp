[package]
name = "deadlock-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Deadlock match and player stats from the Deadlock API, game knowledge from the Deadlock Wiki"
license = "MIT"
authors = ["Konstantin Ostrovskii"]
keywords = ["deadlock", "mcp", "mcp-server", "game-stats", "valve"]
categories = ["games", "command-line-utilities"]
repository = "https://github.com/Grinv/deadlock-mcp"

[workspace]
members = ["xtask"]

[workspace.lints.rust]
# A binary's `pub` items are otherwise exempt from dead-code checks.
dead_code_pub_in_binary = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.cargo]
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true

[dependencies]
garde = { version = "0.23.0", features = ["derive"] }
prost = "0.14.6"
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
ureq = "3.5.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
